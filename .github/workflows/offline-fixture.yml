name: offline fixture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python tools/make_bed.py
      - run: python run.py --doctor
      - run: python run.py --check data
      - run: python run.py --check backtest
      - run: python -m unittest discover -s tests -v
      - run: python run.py --check package
      - run: python tools/redteam_test.py
