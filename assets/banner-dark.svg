<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Reels Factory system readout</title>
  <desc id="desc">A dark instrumentation panel tracing a quant paper through backtest, render, quality control, and human approval.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11161d"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#26303a" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#panel)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <path d="M1 328H1279" stroke="#2a333d"/>
  <path d="M72 72H1208" stroke="#2a333d"/>
  <circle cx="72" cy="72" r="5" fill="#e8b923"/>
  <text x="91" y="78" fill="#aeb7c2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="3">SYSTEM / RESEARCH-TO-REEL</text>
  <text x="72" y="171" fill="#f6f7f9" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">REELS FACTORY</text>
  <text x="75" y="212" fill="#9ca6b2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="1">PAPER IN  /  EVIDENCE OUT  /  RELEASE LOCKED</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
    <text x="75" y="282" fill="#66717d">01</text>
    <text x="105" y="282" fill="#d5d9de">PAPER</text>
    <text x="275" y="282" fill="#66717d">02</text>
    <text x="305" y="282" fill="#d5d9de">BACKTEST</text>
    <text x="515" y="282" fill="#66717d">03</text>
    <text x="545" y="282" fill="#d5d9de">RENDER</text>
    <text x="735" y="282" fill="#66717d">04</text>
    <text x="765" y="282" fill="#e8b923">QC PASS</text>
    <text x="955" y="282" fill="#66717d">05</text>
    <text x="985" y="282" fill="#d5d9de">HUMAN GATE</text>
  </g>
  <path d="M75 303H1134" stroke="#3c4651" stroke-width="2"/>
  <path d="M75 303H824" stroke="#e8b923" stroke-width="2"/>
  <g fill="#0d1117" stroke="#e8b923" stroke-width="2">
    <circle cx="75" cy="303" r="6"/><circle cx="295" cy="303" r="6"/><circle cx="515" cy="303" r="6"/><circle cx="735" cy="303" r="6"/>
  </g>
  <circle cx="955" cy="303" r="6" fill="#0d1117" stroke="#66717d" stroke-width="2"/>
  <rect x="1027" y="104" width="181" height="101" rx="8" fill="#0c1015" stroke="#323c47"/>
  <text x="1048" y="132" fill="#68737f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">RELEASE STATE</text>
  <text x="1048" y="169" fill="#e8b923" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">APPROVAL</text>
  <text x="1048" y="192" fill="#f6f7f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">PENDING</text>
  <text x="72" y="365" fill="#66717d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">1080 x 1920</text>
  <text x="1168" y="365" text-anchor="end" fill="#66717d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">HARD GATES ACTIVE</text>
</svg>
