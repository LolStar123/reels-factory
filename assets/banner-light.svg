<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Reels Factory system readout</title>
  <desc id="desc">A light instrumentation panel tracing a quant paper through backtest, render, quality control, and human approval.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f0ede5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c7c1b5" stroke-width="1" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#panel)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <path d="M1 328H1279" stroke="#d1cbc0"/>
  <path d="M72 72H1208" stroke="#d1cbc0"/>
  <circle cx="72" cy="72" r="5" fill="#9a6900"/>
  <text x="91" y="78" fill="#626a72" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="3">SYSTEM / RESEARCH-TO-REEL</text>
  <text x="72" y="171" fill="#14181d" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">REELS FACTORY</text>
  <text x="75" y="212" fill="#59616a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="1">PAPER IN  /  EVIDENCE OUT  /  RELEASE LOCKED</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
    <text x="75" y="282" fill="#858b91">01</text>
    <text x="105" y="282" fill="#333a41">PAPER</text>
    <text x="275" y="282" fill="#858b91">02</text>
    <text x="305" y="282" fill="#333a41">BACKTEST</text>
    <text x="515" y="282" fill="#858b91">03</text>
    <text x="545" y="282" fill="#333a41">RENDER</text>
    <text x="735" y="282" fill="#858b91">04</text>
    <text x="765" y="282" fill="#8a5e00">QC PASS</text>
    <text x="955" y="282" fill="#858b91">05</text>
    <text x="985" y="282" fill="#333a41">HUMAN GATE</text>
  </g>
  <path d="M75 303H1134" stroke="#b7b0a4" stroke-width="2"/>
  <path d="M75 303H824" stroke="#9a6900" stroke-width="2"/>
  <g fill="#f7f4ed" stroke="#9a6900" stroke-width="2">
    <circle cx="75" cy="303" r="6"/><circle cx="295" cy="303" r="6"/><circle cx="515" cy="303" r="6"/><circle cx="735" cy="303" r="6"/>
  </g>
  <circle cx="955" cy="303" r="6" fill="#f7f4ed" stroke="#858b91" stroke-width="2"/>
  <rect x="1027" y="104" width="181" height="101" rx="8" fill="#f8f6f0" stroke="#c7c1b5"/>
  <text x="1048" y="132" fill="#757c83" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">RELEASE STATE</text>
  <text x="1048" y="169" fill="#8a5e00" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">APPROVAL</text>
  <text x="1048" y="192" fill="#14181d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">PENDING</text>
  <text x="72" y="365" fill="#737a81" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">1080 x 1920</text>
  <text x="1168" y="365" text-anchor="end" fill="#737a81" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">HARD GATES ACTIVE</text>
</svg>
